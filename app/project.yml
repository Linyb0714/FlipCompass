name: FlipCompass
options:
  bundleIdPrefix: app.flipcompass
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: zh-Hans
  createIntermediateGroups: true
  generateEmptyDirectories: true
  groupSortPosition: top
  xcodeVersion: "15.2"
settings:
  base:
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: "NO"
    SWIFT_STRICT_CONCURRENCY: minimal
    DEVELOPMENT_TEAM: "4CLQQTMLA4"
    CODE_SIGN_STYLE: Automatic
    # Intel + Xcode15 默认给模拟器编 arm64+x86_64 双架构，排除 arm64 模拟器切片（真机 arm64 不受影响）
    "EXCLUDED_ARCHS[sdk=iphonesimulator*]": arm64
packages:
  Yams:
    path: /tmp/Yams

targets:
  FlipCompass:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: FlipCompass
        excludes:
          - "Resources/**"
      # 注意：folder reference 不能指向名为 Resources 的目录——iOS17 安装服务会误判为
      # macOS 包布局去 Resources/Info.plist 找 plist，导致 "invalid CFBundleVersion" 安装失败。
      # bundle 内布局为顶层 Modules/，将来 YAML 加载路径用 subdirectory: "Modules/<module>"
      - path: FlipCompass/Resources/Modules
        type: folder
        buildPhase: resources
    settings:
      base:
        INFOPLIST_FILE: FlipCompass/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: app.flipcompass
        PRODUCT_NAME: FlipCompass
        MARKETING_VERSION: "0.4.1"
        CURRENT_PROJECT_VERSION: "1"
        ENABLE_PREVIEWS: "YES"
        GENERATE_INFOPLIST_FILE: "NO"
        ENABLE_TESTABILITY: "YES"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    scripts:
      - name: Pre-sign Assets.car
        when: after
        script: |
          APP="$BUILT_PRODUCTS_DIR/$PRODUCT_NAME.app"
          if [ -f "$APP/Assets.car" ]; then
            /usr/bin/codesign --force -s - "$APP/Assets.car"
          fi
    dependencies:
      - package: Yams
  FlipCompassTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: FlipCompassTests
    dependencies:
      - target: FlipCompass
    settings:
      base:
        GENERATE_INFOPLIST_FILE: "YES"
        PRODUCT_BUNDLE_IDENTIFIER: app.flipcompass.tests
        PRODUCT_NAME: FlipCompassTests
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/FlipCompass.app/FlipCompass"
        BUNDLE_LOADER: "$(TEST_HOST)"
schemes:
  FlipCompass:
    build:
      targets:
        FlipCompass: all
        FlipCompassTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - FlipCompassTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
